<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243a"><title>院内タイマー</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#14243a;background:#eef2f6}*{box-sizing:border-box}body{margin:0;padding:18px 14px 55px}header{max-width:1100px;margin:auto}h1{font-size:25px;margin:5px 0}header p{color:#536478;font-size:13px;margin:5px 0 18px}.section{max-width:1100px;margin:20px auto}h2{font-size:19px;margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.timer{border-radius:16px;padding:15px 12px;background:#fff;border:2px solid #d7e0e9;transition:background .2s}.timer.running{background:#e0f5e8;border-color:#7aca99}.timer.warning{background:#fff0b7;border-color:#e7bd42}.timer.done{background:#ffd9d9;border-color:#eb8181}.timer h3{font-size:15px;margin:0 0 8px}.clock{font-size:clamp(28px,6vw,40px);font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums;text-align:center;margin:10px 0 5px}.status{text-align:center;font-size:12px;font-weight:650;min-height:18px}.choices{display:flex;gap:5px;margin:10px 0}.choices button{flex:1;background:#e7edf5;color:#243e59;border:1px solid #cbd6e3;padding:9px 2px;border-radius:9px;font-weight:700}.choices button.selected{background:#203e62;color:white}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}button{font:inherit;cursor:pointer;touch-action:manipulation}.controls button{border:0;border-radius:10px;padding:12px 4px;font-size:14px;font-weight:700}.start{background:#146b4a;color:#fff}.reset{background:#e0e7ee;color:#2b4158}.extend{grid-column:1/-1;background:#275a9a;color:white}.note{font-size:12px;color:#5a687a;max-width:1100px;margin:20px auto;line-height:1.6}.timer.done .status{color:#a11e1e}.timer.warning .status{color:#865600}</style></head><body><header><h1>院内タイマー</h1><p>12台を独立管理・音なし・画面を再表示すると時間を自動更新</p></header><main id="root"></main><p class="note">※ 画面が消えている間は色の変化を確認できません。再表示時に現在の経過時間を反映します。端末の時刻変更やブラウザのデータ削除にはご注意ください。医療機器本体の停止・安全管理は各機器の設定に従ってください。</p><script>
const KEY='clinic_timers_v3';const groups=[{name:'施術',count:4,options:[20],default:20,extend:true},{name:'ヘルストロン',count:4,options:[10,20,30],default:10},{name:'メドマー',count:2,options:[10,20,30],default:10},{name:'干渉波',count:2,options:[7],default:7}];const defs=groups.flatMap(g=>Array.from({length:g.count},(_,i)=>({...g,id:g.name+'-'+(i+1),label:g.name+' '+(i+1)})));let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){};const states={};for(const d of defs){const s=saved[d.id]||{};states[d.id]={duration:d.options.includes(s.duration)?s.duration:d.default,started:Number.isFinite(s.started)?s.started:null,end:Number.isFinite(s.end)?s.end:null,extra:s.extra===10?10:0};}function persist(){try{localStorage.setItem(KEY,JSON.stringify(states))}catch(e){}}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const root=document.getElementById('root');for(const g of groups){const section=document.createElement('section');section.className='section';section.innerHTML='<h2>'+esc(g.name)+'（'+g.count+'台）</h2><div class="grid"></div>';root.append(section);const grid=section.querySelector('.grid');for(const d of defs.filter(x=>x.name===g.name)){const el=document.createElement('article');el.className='timer';el.id='card-'+d.id;el.innerHTML='<h3>'+esc(d.label)+'</h3><div class="clock">'+String(d.default).padStart(2,'0')+':00</div><div class="status">待機中</div>'+(d.options.length>1?'<div class="choices">'+d.options.map(n=>'<button data-min="'+n+'">'+n+'分</button>').join('')+'</div>':'')+'<div class="controls"><button class="start" data-action="start">スタート</button><button class="reset" data-action="reset">リセット</button>'+(d.extend?'<button class="extend" data-action="extend">＋10分 延長</button>':'')+'</div>';grid.append(el);el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=states[d.id];const now=Date.now();if(b.dataset.min){if(s.started!==null)return;s.duration=Number(b.dataset.min);s.extra=0;}else if(b.dataset.action==='start'){if(s.started===null){s.started=now;s.end=now+(s.duration+s.extra)*60000;}else if(s.end<=now){s.started=now;s.end=now+(s.duration+s.extra)*60000;}}else if(b.dataset.action==='reset'){s.started=null;s.end=null;s.extra=0;}else if(b.dataset.action==='extend'){if(s.extra===10)return;s.extra=10;if(s.started!==null)s.end+=600000;}persist();render();});}}function render(){const now=Date.now();for(const d of defs){const s=states[d.id],el=document.getElementById('card-'+d.id);const active=s.started!==null&&s.end!==null;const rem=active?Math.max(0,Math.ceil((s.end-now)/1000)):(s.duration+s.extra)*60;const elapsed=active?Math.max(0,(now-s.started)/60000):0;const done=active&&s.end<=now;const warning=active&&!done&&(d.extend?elapsed>=10:rem<=(s.duration*60/2));el.className='timer'+(done?' done':warning?' warning':active?' running':'');el.querySelector('.clock').textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');el.querySelector('.status').textContent=done?'時間終了':warning?(d.extend?'10分経過':'残り半分以下'):active?'計測中':s.extra?'延長10分設定済み':'待機中';const start=el.querySelector('[data-action="start"]');start.textContent=done?'再スタート':active?'計測中':'スタート';start.disabled=active&&!done;start.style.opacity=start.disabled?'.55':'1';for(const b of el.querySelectorAll('[data-min]')){b.classList.toggle('selected',Number(b.dataset.min)===s.duration);b.disabled=active;b.style.opacity=active?'.65':'1'}const ext=el.querySelector('[data-action="extend"]');if(ext){ext.disabled=s.extra===10;ext.textContent=s.extra===10?'＋10分 延長済み':'＋10分 延長';ext.style.opacity=ext.disabled?'.55':'1'}}}render();setInterval(render,500);document.addEventListener('visibilitychange',render);window.addEventListener('pageshow',render);
</script></body></html>
